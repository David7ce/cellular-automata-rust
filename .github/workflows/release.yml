# ──────────────────────────────────────────────────────────────────────────
# Cellular Automata — Multi-Platform Release Builder
#   Builds:
#    - Linux:   AppImage & tar.gz, plus a Flatpak bundle (x86_64)
#    - Windows: Inno Setup installer & portable ZIP (x64)
#    - macOS:   DMG & ZIP, Apple Silicon (arm64)
#
# Trigger: a pushed `v*` tag, or manual workflow_dispatch.
# workflow_dispatch modes:
# - release_tag empty -> build artifacts only (no GitHub release published).
# - release_tag set   -> publish release under the specified tag (e.g. v0.2.0).
# ──────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release under (e.g. v0.2.0). Leave empty to build without publishing.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ─── Resolve Version ────────────────────────────────────────────────────────
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve version string
        id: resolve
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          CLEAN="${TAG#v}"
          if ! [[ "$CLEAN" =~ ^[0-9]+\.[0-9]+ ]]; then
            CLEAN=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          fi
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"

  # ─── Linux (AppImage & tar.gz) ──────────────────────────────────────────────
  linux:
    name: Linux x64
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package AppImage & tar.gz
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool

          APP=CellularAutomata.AppDir
          mkdir -p "$APP"
          cp target/release/cellular_automata "$APP/"
          cp packaging/icons/icon.png "$APP/io.github.David7ce.CellularAutomata.png"
          cp packaging/linux/io.github.David7ce.CellularAutomata.desktop "$APP/"
          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./cellular_automata "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          mkdir -p dist
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" "dist/CellularAutomata-$APP_VERSION-Linux-x86_64.AppImage"
          tar -czvf "dist/CellularAutomata-$APP_VERSION-Linux-x86_64.tar.gz" -C target/release cellular_automata

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CellularAutomata-Linux-x64
          path: |
            dist/CellularAutomata-*-Linux-x86_64.AppImage
            dist/CellularAutomata-*-Linux-x86_64.tar.gz

  # ─── Linux (Flatpak) ────────────────────────────────────────────────────────
  linux-flatpak:
    name: Linux Flatpak
    needs: [version, linux]
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Check Flatpak metainfo version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          FILE="flatpak/io.github.David7ce.CellularAutomata.metainfo.xml"
          if ! grep -q "<release version=\"$VERSION\"" "$FILE"; then
            echo "::error::$FILE missing <release version=\"$VERSION\" ...> entry."
            exit 1
          fi

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CellularAutomata-${{ needs.version.outputs.version }}-Linux-x86_64.flatpak
          manifest-path: flatpak/io.github.David7ce.CellularAutomata.json
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.David7ce.CellularAutomata.json') }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v6
        with:
          name: CellularAutomata-Linux-Flatpak
          path: CellularAutomata-*-Linux-x86_64.flatpak
          if-no-files-found: error

  # ─── Windows (Installer & Portable) ─────────────────────────────────────────
  windows:
    name: Windows x64
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Installer & ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\installer.iss" "/DAppVersion=$env:APP_VERSION"
          Copy-Item target\release\cellular_automata.exe CellularAutomata.exe
          Compress-Archive -Path CellularAutomata.exe -DestinationPath "dist\CellularAutomata-$env:APP_VERSION-Windows-Portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CellularAutomata-Windows
          path: |
            dist/CellularAutomata-*-Windows-Setup.exe
            dist/CellularAutomata-*-Windows-Portable.zip

  # ─── macOS (Apple Silicon ARM64) ───────────────────────────────────────────
  macos-arm64:
    name: macOS (Apple Silicon)
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Package .app, DMG & ZIP
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: packaging/macos/bundle.sh target/release/cellular_automata "$APP_VERSION" macOS-arm64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CellularAutomata-macOS-arm64
          path: |
            dist/CellularAutomata-*-macOS-arm64.dmg
            dist/CellularAutomata-*-macOS-arm64.zip

  # ─── Publish Release ────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [version, linux, linux-flatpak, windows, macos-arm64]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          sha256sum *.AppImage *.tar.gz *.flatpak *.exe *.zip *.dmg 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Cellular Automata ${{ github.event.inputs.release_tag || github.ref_name }}"
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            *.tar.gz
            *.flatpak
            *.exe
            *.zip
            *.dmg
            SHA256SUMS