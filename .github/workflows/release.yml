# ──────────────────────────────────────────────────────────────────────────
#  Game of Life — Multi-Platform Release Builder
#
#  Builds:
#    - Linux:   AppImage & tar.gz, plus a Flatpak bundle (x86_64)
#    - Windows: Inno Setup installer & portable ZIP (x64)
#    - macOS:   DMG & ZIP, Apple Silicon (arm64) and Intel (x86_64)
#  Android is not built here — see docs/ROADMAP.md for why.
#
#  Trigger: a pushed `v*` tag, or manual workflow_dispatch.
#  workflow_dispatch has two modes:
#    - release_tag empty -> build every platform, upload artifacts only.
#      Use this to check every platform still builds without publishing.
#    - release_tag set   -> also publish those builds under that tag
#      (e.g. v0.2.0), so a release actually gets created on GitHub.
# ──────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v0.2.0). Leave empty to only upload build artifacts.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ─── Resolve version once ────────────────────────────────────────────────
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version string
        id: resolve
        shell: bash
        run: |
          # Prefer the dispatched release tag, then a pushed v* tag. On a
          # plain dispatch github.ref_name is a branch name, not a version —
          # fall back to Cargo.toml so artifacts never advertise a branch
          # name as their version.
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          clean="${tag#v}"
          if ! [[ "$clean" =~ ^[0-9]+\.[0-9]+ ]]; then
            clean=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          fi
          echo "Resolved version: $clean"
          echo "version=$clean" >> "$GITHUB_OUTPUT"

  # ─── Linux (AppImage & tar.gz) ────────────────────────────────────────────
  linux:
    name: Linux x64 (AppImage & Tar)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - name: Build release binary
        run: cargo build --release

      - name: Package AppImage & tar.gz
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o appimagetool
          chmod +x appimagetool

          APP=ConwayLife.AppDir
          mkdir -p "$APP"
          cp target/release/conway_life "$APP/"
          cp packaging/icons/icon.png "$APP/io.github.David7ce.ConwayLife.png"
          cp packaging/linux/io.github.David7ce.ConwayLife.desktop "$APP/"
          printf '#!/bin/sh\ncd "$(dirname "$0")"\nexec ./conway_life "$@"\n' > "$APP/AppRun"
          chmod +x "$APP/AppRun"

          mkdir -p dist
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APP" \
            "dist/ConwayLife-$APP_VERSION-Linux-x86_64.AppImage"
          tar -czvf "dist/ConwayLife-$APP_VERSION-Linux-x86_64.tar.gz" -C target/release conway_life

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConwayLife-Linux-x64
          path: |
            dist/ConwayLife-*-Linux-x86_64.AppImage
            dist/ConwayLife-*-Linux-x86_64.tar.gz

      - name: Upload raw Linux binary (for the Flatpak job)
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/conway_life
          if-no-files-found: error

  # ─── Linux (Flatpak) ──────────────────────────────────────────────────────
  # Wraps the binary built above rather than compiling inside the sandbox —
  # flatpak-builder's build environment has no network access, so `cargo
  # build` can't fetch crates.io dependencies from inside it.
  linux-flatpak:
    name: Linux x64 (Flatpak)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: flatpak

      - name: Fix binary executable permission
        run: chmod +x flatpak/conway_life

      - name: Stamp version into Flatpak metainfo
        run: |
          sed -i \
            "s|<release version=\"[^\"]*\" date=\"[^\"]*\" />|<release version=\"${{ needs.version.outputs.version }}\" date=\"$(date -u +%Y-%m-%d)\" />|" \
            flatpak/io.github.David7ce.ConwayLife.metainfo.xml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ConwayLife-${{ needs.version.outputs.version }}-Linux-x86_64.flatpak
          manifest-path: flatpak/io.github.David7ce.ConwayLife.json
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.David7ce.ConwayLife.json') }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConwayLife-Linux-Flatpak
          path: ConwayLife-*-Linux-x86_64.flatpak
          if-no-files-found: error

  # ─── Windows (Installer & Portable) ──────────────────────────────────────
  windows:
    name: Windows (Installer & Portable)
    needs: [version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "packaging\windows\installer.iss" "/DAppVersion=$env:APP_VERSION"

      - name: Package Portable ZIP
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\conway_life.exe GameOfLife.exe
          Compress-Archive -Path GameOfLife.exe -DestinationPath "dist\ConwayLife-$env:APP_VERSION-Windows-Portable.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConwayLife-Windows
          path: |
            dist/ConwayLife-*-Windows-Setup.exe
            dist/ConwayLife-*-Windows-Portable.zip

  # ─── macOS (Apple Silicon ARM64) ─────────────────────────────────────────
  macos-arm64:
    name: macOS (Apple Silicon ARM64)
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Package as .app, DMG & ZIP
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: packaging/macos/bundle.sh target/release/conway_life "$APP_VERSION" macOS-arm64

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConwayLife-macOS-arm64
          path: |
            dist/ConwayLife-*-macOS-arm64.dmg
            dist/ConwayLife-*-macOS-arm64.zip

  # ─── macOS (Intel x86_64) ─────────────────────────────────────────────────
  macos-intel:
    name: macOS (Intel x86_64)
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-intel-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-intel-cargo-

      - name: Build release binary (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package as .app, DMG & ZIP
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: packaging/macos/bundle.sh target/x86_64-apple-darwin/release/conway_life "$APP_VERSION" macOS-intel

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ConwayLife-macOS-intel
          path: |
            dist/ConwayLife-*-macOS-intel.dmg
            dist/ConwayLife-*-macOS-intel.zip

  # ─── Create / Publish GitHub Release ──────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [version, linux, linux-flatpak, windows, macos-arm64, macos-intel]
    # Publishes for a pushed v* tag, or a manual dispatch that named a
    # release tag. Still requires every platform to have built: a half
    # published release is worse than none, and each job's artifacts remain
    # downloadable from the run either way.
    if: |
      success() && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event.inputs.release_tag != ''
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          sha256sum *.AppImage *.tar.gz *.flatpak *.exe *.zip *.dmg 2>/dev/null > SHA256SUMS || true
          if [ ! -s SHA256SUMS ]; then
            echo "No release assets found to checksum." >&2
            exit 1
          fi
          cat SHA256SUMS

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Game of Life ${{ github.event.inputs.release_tag || github.ref_name }}"
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.AppImage
            *.tar.gz
            *.flatpak
            *.exe
            *.zip
            *.dmg
            SHA256SUMS
